<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THERAPIOTEON – Mini hra pro zábavu</title>
<style>
:root{color-scheme:dark;--line:#263b5c;--cyan:#36d6e7;--gold:#ffd166;--muted:#a9b8d0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#162c4b 0,#080d19 58%);color:#f3f7ff;font:16px system-ui,Segoe UI,sans-serif;min-height:100vh}
header{padding:30px 18px;text-align:center;border-bottom:1px solid var(--line);background:#080d19aa}
h1{margin:0;color:var(--cyan);letter-spacing:4px;font-size:clamp(27px,5vw,44px)}
header p{color:var(--muted);margin:8px 0 0}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:16px}
a{color:#eaf8ff;text-decoration:none;border:1px solid var(--line);background:#13213a;padding:10px 16px;border-radius:10px}
main{width:min(760px,94%);margin:30px auto 60px}
.panel{background:linear-gradient(145deg,#14233c,#0d1729);border:1px solid var(--line);border-radius:18px;padding:26px;margin:16px 0;box-shadow:0 12px 36px #0005;text-align:center}
h2{margin:0 0 12px;color:var(--gold)}
.machine{display:flex;justify-content:center;gap:12px;margin:28px 0}
.reel{width:clamp(72px,20vw,120px);height:105px;display:grid;place-items:center;font-size:54px;background:#070c16;border:2px solid #4b6387;border-radius:14px}
button{cursor:pointer;border:0;border-radius:11px;padding:15px 28px;font-weight:900;font-size:18px;background:linear-gradient(90deg,#17b9d0,#38d8e7);color:#06111d}
button:disabled{opacity:.55;cursor:not-allowed}
#message{min-height:40px;color:var(--gold);font-weight:800;font-size:22px}
.hint{color:var(--muted);font-size:14px}
#number-show{min-height:68px;margin:12px auto;color:var(--gold);font-size:clamp(28px,7vw,48px);font-weight:1000;letter-spacing:5px;overflow-wrap:anywhere}
.big-win{animation:win-pop .55s ease-in-out infinite alternate;text-shadow:0 0 12px #ffd166,0 0 32px #ff9f1c}
@keyframes win-pop{from{transform:scale(1)}to{transform:scale(1.12)}}
footer{text-align:center;color:var(--muted);padding:24px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header><h1>THERAPIOTEON</h1><p>Mini hra pro zábavu • pouze animace</p></header>
<nav><a href="../">← Zpět na THERAPIOTEON</a></nav>
<main>
<section class="panel">
<h2>✨ Tři symboly</h2>
<p class="hint">Klikni na OTOČIT a sleduj animaci. Nejsou tu žádné sázky, body ani skutečné výhry.</p>
<div class="machine"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">🍀</div></div>
<button id="spin">OTOČIT</button>
<div id="message" aria-live="polite"></div>
<div id="number-show" aria-live="polite"></div>
</section>
</main>
<footer>THERAPIOTEON • Jen mini hra pro zábavu. Bez sázek a odměn.</footer>
<script>
(()=>{
const symbols=['🍒','🍋','⭐','🍀','💎','🔔','🟡'];
const gold='🟡';
let spinning=false;
const reels=[document.getElementById('r1'),document.getElementById('r2'),document.getElementById('r3')];
const message=document.getElementById('message');
const numberShow=document.getElementById('number-show');
const button=document.getElementById('spin');
button.addEventListener('click',()=>{
 if(spinning)return;
 spinning=true;button.disabled=true;message.textContent='Točí se…';numberShow.textContent='';numberShow.classList.remove('big-win');
 let ticks=0;
 const timer=setInterval(()=>{
  reels.forEach(reel=>reel.textContent=symbols[Math.floor(Math.random()*symbols.length)]);
  ticks++;
  if(ticks>=16){
   clearInterval(timer);
   const allGold=reels.every(reel=>reel.textContent===gold);
   if(allGold){
    message.textContent='BIG WIN!!!';
    message.classList.add('big-win');
    let count=0;
    const digits=setInterval(()=>{
     numberShow.textContent+=String(Math.floor(Math.random()*10));
     count++;
     if(count>=24)clearInterval(digits);
    },65);
   }else{
    message.textContent='Pěkné otočení! Zkus animaci znovu.';
    numberShow.textContent='';
    message.classList.remove('big-win');
   }
   spinning=false;button.disabled=false;
  }
 },100);
});
})();
</script>
</body>
</html>
