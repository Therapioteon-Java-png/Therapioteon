<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THERAPIOTEON CASINO</title>
<style>
:root{color-scheme:dark;--line:#263b5c;--cyan:#36d6e7;--gold:#ffd166;--muted:#a9b8d0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#162c4b 0,#080d19 58%);color:#f3f7ff;font:16px system-ui,Segoe UI,sans-serif;min-height:100vh}
header{padding:30px 18px;text-align:center;border-bottom:1px solid var(--line);background:#080d19aa}
h1{margin:0;color:var(--cyan);letter-spacing:4px;font-size:clamp(27px,5vw,44px)}header p{color:var(--muted);margin:8px 0 0}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:16px}a{color:#eaf8ff;text-decoration:none;border:1px solid var(--line);background:#13213a;padding:10px 16px;border-radius:10px}
main{width:min(760px,94%);margin:30px auto 60px}.panel{background:linear-gradient(145deg,#14233c,#0d1729);border:1px solid var(--line);border-radius:18px;padding:26px;margin:16px 0;box-shadow:0 12px 36px #0005;text-align:center}
h2{margin:0 0 12px;color:var(--gold)}.balance{font-size:28px;color:var(--gold);font-weight:800}
.machine{display:flex;justify-content:center;gap:12px;margin:28px 0}.reel{width:clamp(72px,20vw,120px);height:105px;display:grid;place-items:center;font-size:54px;background:#070c16;border:2px solid #4b6387;border-radius:14px}
button{cursor:pointer;border:0;border-radius:11px;padding:15px 28px;font-weight:900;font-size:18px;background:linear-gradient(90deg,#17b9d0,#38d8e7);color:#06111d}
button:disabled{opacity:.55;cursor:not-allowed}#message{min-height:30px;color:var(--gold);font-weight:700}.hint{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);padding:24px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header><h1>THERAPIOTEON CASINO</h1><p>Virtuální automat • herní body bez peněžní hodnoty</p></header>
<nav><a href="../">← Zpět na THERAPIOTEON</a></nav>
<main>
<section class="panel">
<h2>🎰 Automat THERAPIOTEON</h2>
<p class="hint">Stiskni tlačítko a roztoč tři válce. Jedno otočení stojí 10 virtuálních bodů.</p>
<div>Tvůj zůstatek: <span class="balance" id="balance">100</span> <span class="hint">bodů</span></div>
<div class="machine"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">🍀</div></div>
<button id="spin">OTOČIT</button>
<p id="message" aria-live="polite"></p>
</section>
</main>
<footer>THERAPIOTEON • Pouze virtuální body, žádné skutečné peníze.</footer>
<script>
(()=>{
const symbols=['🍒','🍋','⭐','🍀','💎','🔔'];
let points=100, spinning=false;
const balance=document.getElementById('balance'),message=document.getElementById('message'),button=document.getElementById('spin');
function showBalance(){balance.textContent=points}
button.addEventListener('click',()=>{
 if(spinning)return;
 if(points<10){message.textContent='Nemáš dost virtuálních bodů.';return}
 spinning=true;button.disabled=true;points-=10;showBalance();message.textContent='Automat se točí…';
 let ticks=0;
 const timer=setInterval(()=>{
  for(let i=1;i<=3;i++)document.getElementById('r'+i).textContent=symbols[Math.floor(Math.random()*symbols.length)];
  ticks++;
  if(ticks>=12){
   clearInterval(timer);
   const a=document.getElementById('r1').textContent,b=document.getElementById('r2').textContent,c=document.getElementById('r3').textContent;
   let prize=0;if(a===b&&b===c)prize=100;else if(a===b||b===c||a===c)prize=25;
   points+=prize;showBalance();
   message.textContent=prize?'🎉 Výhra: +'+prize+' bodů!':'Tentokrát bez výhry. Zkus znovu!';
   spinning=false;button.disabled=false;
  }
 },100);
});
showBalance();
})();
</script>
</body>
</html>
